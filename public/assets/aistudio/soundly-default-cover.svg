<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1a" />
      <stop offset="50%" stop-color="#0d142c" />
      <stop offset="100%" stop-color="#16224c" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff927c" />
      <stop offset="100%" stop-color="#f47b64" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f47b64" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070b1a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="260" fill="url(#glow)" />

  <!-- Vinyl grooves subtle effect -->
  <circle cx="300" cy="300" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <circle cx="300" cy="300" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
  <circle cx="300" cy="300" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Center Artwork / Equalizer Waves -->
  <g transform="translate(300, 270)">
    <!-- Equalizer bars -->
    <rect x="-85" y="-45" width="14" height="90" rx="7" fill="url(#coralGrad)" opacity="0.6" />
    <rect x="-55" y="-75" width="14" height="150" rx="7" fill="url(#coralGrad)" opacity="0.8" />
    <rect x="-25" y="-105" width="14" height="210" rx="7" fill="url(#coralGrad)" />
    <rect x="5" y="-85" width="14" height="170" rx="7" fill="url(#coralGrad)" />
    <rect x="35" y="-60" width="14" height="120" rx="7" fill="url(#coralGrad)" opacity="0.9" />
    <rect x="65" y="-35" width="14" height="70" rx="7" fill="url(#coralGrad)" opacity="0.5" />
  </g>

  <!-- Center spindle hole -->
  <circle cx="300" cy="270" r="12" fill="#070b1a" stroke="#f47b64" stroke-width="4" />

  <!-- Brand Title & Subtitle -->
  <text x="300" y="465" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="800" font-size="32" fill="#f7f5f0" text-anchor="middle" letter-spacing="3">SOUNDLY</text>
  <text x="300" y="500" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="500" font-size="15" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">Âm nhạc theo cách riêng</text>
</svg>
