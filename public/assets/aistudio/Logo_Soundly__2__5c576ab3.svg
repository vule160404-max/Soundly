<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d3d" />
      <stop offset="100%" stop-color="#070b1a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff927c" />
      <stop offset="100%" stop-color="#f47b64" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  {/* Background Rounded Octagonal Badge filling the canvas */}
  <path d="M140 24h232c63.5 0 116 52.5 116 116v232c0 63.5-52.5 116-116 116H140c-63.5 0-116-52.5-116-116V140C24 76.5 76.5 24 140 24z" fill="url(#iconBg)" filter="url(#shadow)" stroke="#1e2a54" stroke-width="4" />
  
  {/* 3 Equalizer Waves / Bars in Center, Large and Prominent */}
  <g transform="translate(256, 256)">
    <!-- Left bar -->
    <rect x="-105" y="-80" width="44" height="160" rx="22" fill="url(#barGrad)" opacity="0.85" />
    <!-- Center bar (tallest) -->
    <rect x="-22" y="-130" width="44" height="260" rx="22" fill="url(#barGrad)" />
    <!-- Right bar -->
    <rect x="61" y="-100" width="44" height="200" rx="22" fill="url(#barGrad)" opacity="0.9" />
  </g>
</svg>